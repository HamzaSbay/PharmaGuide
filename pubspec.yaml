name: pharmaguide_tn
description: "PharmaGuide TN — Real-time pharmacy stock locator and B2B network for Tunisia. Search medications, find nearby pharmacies with stock, and reserve for 2-hour in-person collection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Internationalization
  intl: ^0.20.2

  # Firebase & Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Prescription OCR (ML Kit)
  google_mlkit_text_recognition: ^0.14.0

  # File & Data Handling
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  csv: ^6.0.0

  # Backend & Auth (Supabase)
  supabase_flutter: ^2.8.3

  # Location & Maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Audio Notifications
  audioplayers: ^6.1.0

  # Barcode Scanning
  mobile_scanner: ^6.0.2

  # Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Utilities
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 23

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/data/
